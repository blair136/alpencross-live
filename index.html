<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpencross – Live-Standort</title>
<meta name="theme-color" content="#0A2028">
<link rel="icon" href="icons/berge.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /*
   * Dieselbe Sprache wie die Tourseite — aber bewusst nicht dieselbe
   * Anordnung.
   *
   * Die Tourseite darf einen großen Kopfbereich haben: Sie wird zu Hause
   * gelesen, aus Vorfreude. Diese Seite nicht. Wer sie öffnet, will eine
   * einzige Frage beantwortet haben — wo ist der Mensch gerade —, und das
   * womöglich nachts und beunruhigt. Jede Zierde, die die Karte nach unten
   * schiebt, macht diese Seite schlechter. Die Gestaltung steckt deshalb im
   * schwebenden Feld und im Alarm, nicht in einem Aufmacher.
   */
  :root {
    --tinte:#10333D; --weich:#5C7079;
    --route:#D9327A; --petrol:#0E9AA5; --petrol-tief:#0E5E66;
    --karte:rgba(255,255,255,.94); --rand:rgba(16,51,61,.10);
    --alarm:#B5301F;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --tinte:#E8F1F3; --weich:#9DAEB5;
      --karte:rgba(16,38,46,.93); --rand:rgba(255,255,255,.12);
    }
  }

  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body {
    font-family:ui-rounded, -apple-system, system-ui, "Segoe UI", sans-serif;
    color:var(--tinte); background:#0A2028;
  }
  #karte { height:100%; }

  /* ------------------------------------------------ Schwebendes Feld */

  .kopf {
    position:fixed; z-index:1000;
    top:calc(12px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    width:min(440px, calc(100vw - 24px));
    background:var(--karte); border:1px solid var(--rand); border-radius:18px;
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    box-shadow:0 6px 26px rgba(6,19,25,.28);
    padding:13px 16px 14px;
  }
  .marke {
    display:flex; align-items:center; gap:7px;
    font-size:11px; font-weight:800; letter-spacing:1.3px; text-transform:uppercase;
    color:var(--petrol-tief);
  }
  @media (prefers-color-scheme: dark) { .marke { color:var(--petrol); } }
  .marke img { width:17px; height:17px; opacity:.8; }
  @media (prefers-color-scheme: dark) { .marke img { filter:invert(1); opacity:.75; } }
  /* Der grüne Punkt sagt „es kommen Daten" — ohne ihn wüsste niemand, ob
     die Seite noch lebt oder nur ein altes Bild zeigt. */
  .herz {
    width:7px; height:7px; border-radius:50%; background:#2FA84F; margin-left:auto;
    animation:atmen 2.4s ease-in-out infinite;
  }
  .herz.still { background:var(--weich); animation:none; }
  @keyframes atmen { 0%,100% { opacity:.35; } 50% { opacity:1; } }

  .stand-haupt {
    font-size:17px; font-weight:800; letter-spacing:-.2px; margin:6px 0 0;
    line-height:1.25;
  }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .chip {
    display:inline-flex; align-items:center; gap:5px;
    background:rgba(14,154,165,.12); color:var(--tinte);
    border-radius:8px; padding:4px 9px; font-size:12.5px; font-weight:700;
  }
  @media (prefers-color-scheme: dark) { .chip { background:rgba(14,154,165,.2); } }
  .chip svg { width:12px; height:12px; }
  .chip.spaet { background:rgba(181,48,31,.13); color:#A8291A; }
  @media (prefers-color-scheme: dark) { .chip.spaet { background:rgba(181,48,31,.28); color:#F0A99C; } }
  .leise { color:var(--weich); font-size:13.5px; margin-top:6px; line-height:1.45; }

  /* -------------------------------------------------- Punkt und Spur */

  .live-punkt { position:relative; width:24px; height:24px; }
  .live-punkt::before {
    content:''; position:absolute; inset:0; border-radius:50%;
    background:var(--route); animation:welle 2.2s ease-out infinite;
  }
  .live-punkt::after {
    content:''; position:absolute; inset:6px; border-radius:50%;
    background:var(--route); border:2.5px solid #fff;
    box-shadow:0 1px 7px rgba(0,0,0,.45);
  }
  @keyframes welle {
    0%   { transform:scale(.5); opacity:.6; }
    100% { transform:scale(2.4); opacity:0; }
  }
  @media (prefers-reduced-motion:reduce) {
    .live-punkt::before { animation:none; opacity:.25; }
    .herz { animation:none; }
  }

  /* Zurück zum Wandernden, nachdem man die Karte verschoben hat. */
  .folgen {
    position:fixed; z-index:1000; right:14px;
    bottom:calc(22px + env(safe-area-inset-bottom));
    display:inline-flex; align-items:center; gap:7px;
    background:var(--karte); border:1px solid var(--rand); border-radius:999px;
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    box-shadow:0 4px 18px rgba(6,19,25,.28);
    padding:10px 15px; font:800 13.5px ui-rounded, system-ui, sans-serif;
    color:var(--tinte); cursor:pointer;
  }
  .folgen svg { width:14px; height:14px; color:var(--route); }

  /* -------------------------------------------------------- Alarm */

  .alarm {
    position:fixed; left:0; right:0; bottom:0; z-index:1001;
    background:var(--alarm); color:#fff;
    padding:16px 18px calc(16px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 26px rgba(0,0,0,.35);
  }
  .alarm-kopf { display:flex; align-items:center; gap:9px; }
  .alarm h2 { margin:0; font-size:18px; font-weight:800; }
  .alarm p { margin:7px 0 0; font-size:14px; line-height:1.45; }
  .alarm .ort {
    font-variant-numeric:tabular-nums; opacity:.9; font-size:13px;
  }
  /* Im Ernstfall zählt, dass man mit dem Daumen trifft — nicht, dass es
     hübsch ist. Deshalb Knöpfe statt Textlinks in einer Zeile. */
  .notrufe { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .notruf {
    flex:1 1 auto; min-width:104px; text-align:center; text-decoration:none;
    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3);
    border-radius:11px; padding:11px 12px; color:#fff;
  }
  .notruf b { display:block; font-size:19px; font-weight:800; letter-spacing:.5px; }
  .notruf span { display:block; font-size:11px; opacity:.85; margin-top:2px; }

  /* ------------------------------------------------------- Zustand */

  .zustand {
    position:fixed; inset:0; z-index:1002;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:13px; padding:40px 24px; text-align:center;
    background:#0A2028; color:#fff;
  }
  .zustand img { width:60px; height:60px; filter:invert(1) opacity(.7); }
  .zustand h2 { margin:0; font-size:20px; font-weight:800; }
  .zustand p { margin:0; color:#9DAEB5; font-size:15px; line-height:1.55; max-width:34ch; }

  /*
   * Ganz am Ende, und das mit Absicht.
   *
   * Stand die Regel weiter oben, gewann jedes später definierte `display`
   * bei gleicher Spezifität — die Zustandsfläche lag dann trotz `versteckt`
   * über der ganzen Seite und zeigte einen Wegweiser ohne Text. Beim
   * Durchspielen sofort aufgefallen, beim Lesen des Stylesheets nicht.
   */
  .versteckt { display:none; }
</style>
</head>
<body>
<div id="karte"></div>

<div class="kopf" id="kopf">
  <div class="marke">
    <img src="icons/berge.png" alt=""> Alpencross · Live-Standort
    <span class="herz still" id="herz"></span>
  </div>
  <div class="stand-haupt" id="haupt">Verbinde …</div>
  <div class="chips" id="chips"></div>
  <div class="leise versteckt" id="leise"></div>
</div>

<button class="folgen versteckt" id="folgen" type="button">
  <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
    <circle cx="8" cy="8" r="3" fill="currentColor"/>
    <circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.6"/>
  </svg>
  Wieder folgen
</button>

<div class="alarm versteckt" id="alarm" role="alert">
  <div class="alarm-kopf">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3.5 22 20.5H2L12 3.5Z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
      <path d="M12 10v4.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="12" cy="17.6" r="1.25" fill="#fff"/>
    </svg>
    <h2>Überfällig</h2>
  </div>
  <p id="alarmText"></p>
  <p class="ort" id="alarmOrt"></p>
  <div class="notrufe">
    <a class="notruf" href="tel:112"><b>112</b><span>Notruf EU</span></a>
    <a class="notruf" href="tel:140"><b>140</b><span>Bergrettung Österreich</span></a>
    <a class="notruf" href="tel:118"><b>118</b><span>Italien / Südtirol</span></a>
  </div>
</div>

<div class="zustand versteckt" id="zustand">
  <img src="icons/wegweiser.png" alt="">
  <h2 id="zustandTitel"></h2>
  <p id="zustandText"></p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var URL_BASIS = 'https://srwkwxmmhefivmvxfnos.supabase.co';
  var KEY = 'sb_publishable_8U2BtQi77k6PCifEmXFYDg_VxSpwhoL';
  var token = new URLSearchParams(location.search).get('t') || '';

  var UHR = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.3" stroke="currentColor" stroke-width="1.8"/><path d="M8 4.6V8l2.4 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var GIPFEL = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M1.4 13 6 5l2.6 4.3L10.4 6l4.2 7H1.4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>';
  var ZIEL = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 2v12M4 3h8l-1.6 2.6L12 8H4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var karte = L.map('karte', { zoomControl: false }).setView([46.5, 11.5], 6);
  L.control.zoom({ position: 'bottomleft' }).addTo(karte);

  /*
   * Topografische Karte statt der einfachen Straßenkarte: Wer hier
   * mitschaut, will das Gelände sehen, in dem jemand unterwegs ist —
   * Höhenlinien sagen mehr als Straßennamen. Antwortet der freie Dienst
   * nicht, springt die gewohnte Karte ein.
   */
  var topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    maxZoom: 17,
    attribution: '&copy; OpenStreetMap-Mitwirkende · SRTM · Darstellung &copy; OpenTopoMap (CC-BY-SA)'
  }).addTo(karte);
  var gewechselt = false, kachelFehler = 0;
  topo.on('tileerror', function () {
    if (gewechselt || ++kachelFehler < 4) return;
    gewechselt = true;
    karte.removeLayer(topo);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 17, attribution: '&copy; OpenStreetMap-Mitwirkende'
    }).addTo(karte);
  });

  // Spur wie auf der Tourseite: heller Saum unter der farbigen Linie, damit
  // sie auf jedem Untergrund lesbar bleibt.
  var saum = L.polyline([], { color: '#ffffff', weight: 8, opacity: .9 }).addTo(karte);
  var spur = L.polyline([], { color: '#0E9AA5', weight: 4.5 }).addTo(karte);
  var marker = null, ersterFix = true;

  /*
   * Der Karte folgen, bis jemand sie selbst anfasst.
   *
   * Vorher wurde einmal zentriert und danach nie wieder. Wer eine Stunde
   * zusah, sah irgendwann eine leere Karte, weil der Wandernde aus dem Bild
   * gelaufen war — und musste raten, in welche Richtung. Jetzt läuft die
   * Karte mit; wer selbst verschiebt, behält die Ansicht und bekommt einen
   * Knopf zurück.
   */
  var folgen = true;
  var knopf = document.getElementById('folgen');
  karte.on('dragstart', function () {
    folgen = false;
    knopf.classList.remove('versteckt');
  });
  knopf.addEventListener('click', function () {
    folgen = true;
    knopf.classList.add('versteckt');
    if (marker) karte.setView(marker.getLatLng(), Math.max(karte.getZoom(), 14));
  });

  /* Deutsches Komma. „1.6 Stunden" ist kein Tippfehler, den man überliest —
     es liest sich wie eine fremde Anwendung, und ausgerechnet im Alarmtext
     soll nichts nach Maschine klingen. */
  function komma(n) { return n.toFixed(1).replace('.', ','); }

  function zeit(iso) {
    var s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 90) return 'gerade eben';
    if (s < 3600) return 'vor ' + Math.round(s / 60) + ' min';
    return 'vor ' + komma(s / 3600) + ' h';
  }
  function uhr(iso) {
    return new Date(iso).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  }
  function dauer(min) {
    return min < 60 ? min + ' min' : komma(min / 60) + ' h';
  }

  function zustand(titel, text) {
    document.getElementById('zustandTitel').textContent = titel;
    document.getElementById('zustandText').textContent = text;
    document.getElementById('zustand').classList.remove('versteckt');
  }

  function laden() {
    fetch(URL_BASIS + '/rest/v1/rpc/live_lesen', {
      method: 'POST',
      headers: { 'content-type': 'application/json', apikey: KEY, authorization: 'Bearer ' + KEY },
      body: JSON.stringify({ rt: token })
    }).then(function (r) { return r.json(); }).then(function (rows) {
      var haupt = document.getElementById('haupt');
      var chips = document.getElementById('chips');
      var leise = document.getElementById('leise');
      var herz = document.getElementById('herz');
      var alarm = document.getElementById('alarm');
      var p = rows && rows[0];

      if (!p) {
        herz.classList.add('still');
        haupt.textContent = 'Kein aktives Teilen';
        chips.innerHTML = '';
        leise.textContent =
          'Die Wanderung ist beendet oder der Link abgelaufen. Die zuletzt gezeigte Spur bleibt stehen.';
        leise.classList.remove('versteckt');
        alarm.classList.add('versteckt');
        return;
      }

      herz.classList.remove('still');
      leise.classList.add('versteckt');

      var pos = [p.lat, p.lng];
      if (!marker) {
        marker = L.marker(pos, {
          icon: L.divIcon({
            className: '', html: '<div class="live-punkt"></div>',
            iconSize: [24, 24], iconAnchor: [12, 12]
          })
        }).addTo(karte);
      }
      marker.setLatLng(pos);
      saum.addLatLng(pos);
      spur.addLatLng(pos);
      if (ersterFix) { karte.setView(pos, 14); ersterFix = false; }
      else if (folgen) { karte.panTo(pos, { animate: true, duration: .6 }); }

      haupt.textContent = 'Unterwegs seit ' + uhr(p.gestartet) + ' Uhr';

      /*
       * Wie lange ist das letzte Signal her?
       *
       * Der gefährlichste Zustand dieser Seite war der stille: Wer ohne
       * Rückmeldezeit teilt und dann stürzt, dessen Telefon hört einfach auf
       * zu melden — und die Seite zeigte weiter „Unterwegs seit 09:12" mit
       * der letzten Position. Sie sah lebendig aus. Genau dafür gibt es sie
       * aber nicht.
       *
       * Die App meldet sich jede Minute, solange sie Empfang hat. Eine
       * Dreiviertelstunde Stille ist also entweder ein Funkloch oder etwas
       * anderes — und beides muss dastehen, nicht nur das eine.
       */
      var stillMin = Math.round((Date.now() - new Date(p.aktualisiert).getTime()) / 60000);
      var STILL_HINWEIS = 45;
      var STILL_ALARM = 150;

      var teile = ['<span class="chip' + (stillMin >= STILL_HINWEIS ? ' spaet' : '') + '">' +
        UHR + ' ' + zeit(p.aktualisiert) + '</span>'];
      if (p.ele != null) {
        teile.push('<span class="chip">' + GIPFEL + ' ' + p.ele + ' m</span>');
      }

      /*
       * Rückmeldezeit: Ohne sie bleibt die Seite eine reine Anzeige. Mit ihr
       * meldet sie sich selbst, wenn jemand nicht zurück ist — genau dann
       * braucht es eine Entscheidung, und niemand starrt auf den Bildschirm.
       */
      var stilleGemeldet = false;
      if (stillMin >= STILL_HINWEIS) {
        // Beide Erklärungen nennen. Wer nur „kein Signal" liest, denkt an
        // einen Fehler der Seite; wer nur „Alarm" liest, ruft beim ersten
        // Funkloch die Bergrettung.
        var stilleText =
          'Seit ' + dauer(stillMin) + ' kein Signal. Das kann ein Funkloch sein — ' +
          'die App meldet sich sonst jede Minute.';
        if (stillMin >= STILL_ALARM) {
          document.getElementById('alarmText').textContent = stilleText;
          document.getElementById('alarmOrt').textContent =
            'Letzte Position: ' + p.lat.toFixed(5) + ', ' + p.lng.toFixed(5) +
            (p.ele != null ? ' · ' + p.ele + ' m' : '');
          alarm.classList.remove('versteckt');
          stilleGemeldet = true;
        } else {
          leise.textContent = stilleText;
          leise.classList.remove('versteckt');
        }
      }

      if (p.zurueck_um) {
        var restMin = Math.round((new Date(p.zurueck_um).getTime() - Date.now()) / 60000);
        if (restMin >= 0) {
          teile.push('<span class="chip">' + ZIEL + ' zurück gegen ' + uhr(p.zurueck_um) + ' Uhr</span>');
          if (!stilleGemeldet) alarm.classList.add('versteckt');
        } else {
          var ueber = Math.abs(restMin);
          teile.push('<span class="chip spaet">' + ZIEL + ' überfällig seit ' + dauer(ueber) + '</span>');
          document.getElementById('alarmText').textContent =
            'Rückmeldung war für ' + uhr(p.zurueck_um) + ' Uhr angekündigt — seither ' +
            (ueber < 60 ? ueber + ' Minuten' : komma(ueber / 60) + ' Stunden') +
            ' vergangen. Letztes Signal ' + zeit(p.aktualisiert) + '.';
          document.getElementById('alarmOrt').textContent =
            'Letzte Position: ' + p.lat.toFixed(5) + ', ' + p.lng.toFixed(5) +
            (p.ele != null ? ' · ' + p.ele + ' m' : '');
          alarm.classList.remove('versteckt');
        }
      }
      chips.innerHTML = teile.join('');
    }).catch(function () {
      document.getElementById('herz').classList.add('still');
      var leise = document.getElementById('leise');
      leise.textContent = 'Keine Verbindung — der Versuch läuft weiter.';
      leise.classList.remove('versteckt');
    });
  }

  if (!token) {
    document.getElementById('kopf').classList.add('versteckt');
    zustand('Dieser Link führt nirgendwohin',
      'Zum Mitschauen braucht es den Link, den die App beim Teilen erzeugt. Frag noch einmal danach.');
  } else {
    laden();
    setInterval(laden, 20000);
  }
</script>
</body>
</html>
